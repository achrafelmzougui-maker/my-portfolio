<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arabic Learning Game — Demo</title><style>body{font-family:system-ui;background:#0b1324;color:#f4f8ff;margin:0}main{max-width:650px;margin:10vh auto;padding:26px}section{background:#17233a;padding:32px;border-radius:24px}h1{color:#72e2ca}#word{font-size:64px;text-align:center;margin:24px}button{display:block;width:100%;padding:15px;margin:9px 0;background:#243653;border:1px solid #527085;color:white;border-radius:12px;cursor:pointer;font:inherit}button:hover{background:#2d5366}#next{background:#4dd0b0;color:#0b1324;font-weight:700}small{color:#a9bdd2}a{color:#72e2ca}</style></head><body><main><a href="../">← Portfolio</a><h1>تعلم العربية</h1><p>Mini-jeu éducatif · reconstruction web</p><section><small id="progress"></small><div id="word" lang="ar" dir="rtl"></div><div id="answers"></div><p id="feedback" aria-live="polite"></p><button id="next" hidden>Question suivante</button></section><p><small>Questions de démonstration, sans base de données. Ce n'est pas le projet JavaFX original.</small></p></main><script>const questions=[{word:'كتاب',options:['Livre','Maison','Eau'],answer:0},{word:'مدرسة',options:['Voiture','École','Arbre'],answer:1},{word:'ماء',options:['Eau','Soleil','Stylo'],answer:0},{word:'قلم',options:['Maison','Chat','Stylo'],answer:2}];let i=0,score=0;const $=id=>document.getElementById(id);function render(){if(i>=questions.length){$('progress').textContent='Terminé';$('word').textContent=score+' / '+questions.length;$('answers').replaceChildren();$('feedback').textContent='Bravo ! Vous pouvez recommencer.';$('next').textContent='Recommencer';$('next').hidden=false;return}const q=questions[i];$('progress').textContent='Question '+(i+1)+' / '+questions.length;$('word').textContent=q.word;$('feedback').textContent='';$('next').hidden=true;$('next').textContent='Question suivante';$('answers').replaceChildren();q.options.forEach((label,index)=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>{if(index===q.answer)score++;$('feedback').textContent=index===q.answer?'Bonne réponse !':'Réponse correcte : '+q.options[q.answer];[...$('answers').children].forEach(x=>x.disabled=true);$('next').hidden=false};$('answers').append(b)})}$('next').onclick=()=>{if(i>=questions.length){i=0;score=0}else i++;render()};render();</script></body></html>
